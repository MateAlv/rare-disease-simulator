# MVP configuration placeholder.
#
# This file will hold source locations, selected diseases, LLM extraction
# settings, profile merge thresholds, simulator parameters, and export paths.

mvp:
  diseases:
    - disease: Niemann-Pick disease type C1
      gene: NPC1
      orpha_id: ORPHA:646
      omim:
        - OMIM:257220
    - disease: Rett syndrome / atypical Rett syndrome
      gene: MECP2
    - disease: Duchenne muscular dystrophy
      gene: DMD
    - disease: Cystic fibrosis
      gene: CFTR
    - disease: Neuronal ceroid lipofuscinosis 6
      gene: CLN6
    - disease: Pompe disease / glycogen storage disease II
      gene: GAA
    - disease: Hypophosphatasia
      gene: ALPL
    - disease: Noonan syndrome
      gene: PTPN11

# The HPOA build reads the inputs pinned by diagnostic.ar-training
# (data/sources.yaml), which is checked out next to this repo.
sources:
  hpo_dir: data/raw/hpo
  hpo_terms_path: data/raw/hpo/hpo_terms.tsv
  # HPO 2026-02-16.
  hpo_json_path: ../diagnostic.ar-training/data/raw/hpo_ontology/hp.json
  phenotype_annotation_path: ../diagnostic.ar-training/data/raw/hpo_annotations/phenotype.hpoa
  genes_to_phenotype_path: data/raw/hpo/genes_to_phenotype.txt
  genes_to_disease_path: ../diagnostic.ar-training/data/raw/hpo_genes_to_disease/genes_to_disease.txt
  # Orphanet 2026-06-23, sha256 38fef7e9e398addb147e57df7bb523e5ef072e03c0208ae81b37a2fd200af1ab.
  orphanet_ages_path: ../diagnostic.ar-training/data/raw/orphanet_ages_2026_06/en_product9_ages.xml
  # Orphanet 2026-06-23 en_product1, sha256 df8d562a0c6011af36a74eb4000ce81ca7d723e8031010819fb71727c0962bbb.
  # Only exact, validated alignments carry Orphanet onset to OMIM diseases.
  omim_orpha_map_path: ../diagnostic.ar-training/data/raw/orphanet_alignments/en_product1.xml
  # Held-out publications of the frozen r1-v1 split; HPOA rows citing any are dropped.
  exclude_pmids_path: ../diagnostic.ar-training/data/splits/r1-v1.heldout-pmids.txt
  negative_phenotype_annotation_path: data/raw/hpo/negative_phenotype_annotation.tab
  orphadata_dir: data/raw/orphadata
  mondo_path: data/raw/mondo/mondo.json

llm:
  provider: dummy
  model: dummy
  prompt_version: mvp-v0
  extraction_schema_version: mvp-v0
  cache_dir: data/cache/llm_extraction
  temperature: 0.0

simulation:
  difficulties:
    - easy
    - medium
    - hard
  cases_per_disease_per_difficulty: 100
  seed: 42

exports:
  profiles_path: outputs/profiles.jsonl
  profile_patches_path: outputs/profile_patches.jsonl
  rich_cases_path: outputs/rich_cases.jsonl
  graphens_path: outputs/graphens.json
  review_dir: outputs/review

fixtures:
  fixture_dir: data/fixtures
